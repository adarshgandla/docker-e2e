# Nginx SPA config — for serving a React app
# Handles client-side routing: all paths return index.html
# React Router then handles the route on the client side

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Serve files — if file doesn't exist, fall back to index.html
    # This is what makes React Router work (without it, refreshing /tasks/5 gives 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
