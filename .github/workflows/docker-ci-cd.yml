# ==============================================================================
# 🐳 TASKFLOW — ENTERPRISE DOCKER CI/CD AUTOMATION PIPELINE
# ==============================================================================
# High-Level Architecture:
# 1. Developer pushes code to 'main' or opens a Pull Request.
# 2. GitHub provisions a clean Ubuntu Linux virtual machine runner.
# 3. Moby BuildKit initializes with QEMU multi-architecture CPU emulation.
# 4. Authenticates to GitHub Container Registry (GHCR) using ephemeral GITHUB_TOKEN.
# 5. Compiles multi-stage Dockerfiles with GitHub Actions cloud layer caching (gha).
# 6. Tags images with ':latest', Git commit SHA, and Semantic Versioning tags.
# 7. Publishes cryptographically verified OCI image layers to GitHub Packages.
# 8. Watchtower running on production servers detects new image digests and
#    performs automated zero-downtime rolling updates.
# ==============================================================================

name: 🐳 Docker CI/CD — Build, Test & Auto-Deploy

# ------------------------------------------------------------------------------
# 🎯 WORKFLOW TRIGGERS (When does this pipeline run?)
# ------------------------------------------------------------------------------
on:
  # 1. Push to main: Triggers automated build & release to GitHub Packages
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Triggers on semantic version release tags (e.g., v1.0.0, v2.1.3)

  # 2. Pull Request: Validates that Dockerfiles compile successfully BEFORE merging
  pull_request:
    branches:
      - main

  # 3. Manual Dispatch: Adds a 1-click "Run workflow" button in GitHub Actions UI
  workflow_dispatch:

# ------------------------------------------------------------------------------
# 🔐 LEAST PRIVILEGE PERMISSIONS
# ------------------------------------------------------------------------------
permissions:
  contents: read   # Read-only access to repository source code (SOC 2 best practice)
  packages: write  # Write access to publish Docker container images to ghcr.io

# ------------------------------------------------------------------------------
# 🌍 GLOBAL ENVIRONMENT VARIABLES
# ------------------------------------------------------------------------------
env:
  REGISTRY: ghcr.io # GitHub Container Registry (Rate-limit free alternative to Docker Hub)
  IMAGE_PREFIX: ${{ github.repository_owner }}/docker-e2e # Evaluates dynamically to user/org

jobs:
  # ============================================================================
  # 📦 JOB 1: TRACK 1 — SINGLE-CONTAINER ALL-IN-ONE PIPELINE
  # ============================================================================
  build-and-push-single:
    name: 📦 Build & Publish Single Container
    runs-on: ubuntu-latest # Clean Azure-hosted Linux VM (2 vCPU, 7GB RAM)
    steps:
      # Step 1: Clone repository code onto the runner VM
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      # Step 2: Install QEMU hardware emulator for cross-architecture builds (AMD64 & ARM64/Apple Silicon)
      - name: ⚙️ Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      # Step 3: Initialize Docker Buildx (Moby BuildKit engine with parallel builds & layer caching)
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Authenticate to GitHub Container Registry (GHCR)
      # Uses temporary GITHUB_TOKEN generated automatically by GitHub (no manual secrets needed!)
      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' # Only publish on merge/push, never on untrusted PRs
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Generate smart OCI tags and labels (:latest, :v1.0.0, :sha-xxxxxxx)
      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-single
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      # Step 6: Build multi-stage Dockerfile and push to GHCR with cloud layer caching
      - name: 🚀 Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./01-single-container
          file: ./01-single-container/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ⚡ GitHub Actions Cloud Cache: Caches npm dependencies & base layers in GitHub Cloud
          # Reduces recurring build time from ~3 minutes down to under 25 seconds!
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 🏗️ JOB 2: TRACK 2 — MULTI-CONTAINER MICROSERVICES PIPELINE
  # ============================================================================
  build-and-push-multi:
    name: 🏗️ Build & Publish Microservices (API & UI)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 2A: Backend API Image (Node.js Express + Postgres + Redis) ---
      - name: 🏷️ Extract Backend Metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🚀 Build and Push Backend API Image
        uses: docker/build-push-action@v6
        with:
          context: ./02-multi-container/backend
          file: ./02-multi-container/backend/Dockerfile
          target: production # Multi-stage target: Strips devDependencies and runs as unprivileged appuser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2B: Frontend UI Image (React compiled into 25MB Nginx Alpine) ---
      - name: 🏷️ Extract Frontend Metadata
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🚀 Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./02-multi-container/frontend
          file: ./02-multi-container/frontend/Dockerfile
          target: production # Multi-stage target: Discards Node.js compiler, serves static dist via Nginx
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 🐬 JOB 3: TRACK 3 — HOST MYSQL BRIDGE PIPELINE
  # ============================================================================
  build-and-push-host-mysql:
    name: 🐬 Build & Publish Host MySQL Bridge (API & UI)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 3A: Host MySQL Backend API Image ---
      - name: 🏷️ Extract MySQL Backend Metadata
        id: meta-mysql-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mysql-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🚀 Build and Push MySQL Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./03-host-database-mysql/backend
          file: ./03-host-database-mysql/backend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-mysql-backend.outputs.tags }}
          labels: ${{ steps.meta-mysql-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 3B: Host MySQL Frontend UI Image with Nginx Reverse Proxy ---
      - name: 🏷️ Extract MySQL Frontend Metadata
        id: meta-mysql-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mysql-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🚀 Build and Push MySQL Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./03-host-database-mysql/frontend
          file: ./03-host-database-mysql/frontend/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-mysql-frontend.outputs.tags }}
          labels: ${{ steps.meta-mysql-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
