# ==============================================================================
# 🐳 TRACK 3: DECOUPLED ARCHITECTURE (HOST MYSQL BRIDGE)
# ==============================================================================
# This configuration matches the EXACT same decoupled structure as Track 2!
#
# Track 2 had:
#   1. frontend container (React Vite)
#   2. backend container (Express API)
#   3. postgres container (in Docker)
#   4. redis container (in Docker)
#
# Track 3 has:
#   1. frontend container (React Vite) -> Identical to Track 2
#   2. backend container (Express API)  -> Identical to Track 2
#   * NO containerized DB! The backend connects to your laptop's local MySQL
#     using 'host.docker.internal' and 'extra_hosts'!
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BACKEND SERVICE: Express API Bridging to Host MySQL
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: development
    container_name: taskflow_mysql_backend
    restart: unless-stopped
    stop_grace_period: 15s

    # Resource governance
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    environment:
      PORT: 4001
      NODE_ENV: development
      # 🔑 Database connection: Local Host MySQL or Cloud MySQL
      MYSQL_URL: ${MYSQL_URL:-}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simple_app}
      MYSQL_SSL: ${MYSQL_SSL:-false}

    # 🌐 LINUX & CROSS-PLATFORM COMPATIBILITY:
    # Maps 'host.docker.internal' to the host machine gateway IP
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "4001:4001"

    volumes:
      # Live code hot-reloading (same as Track 2)
      - ./backend:/app
      - /app/node_modules

  # ----------------------------------------------------------------------------
  # 2. FRONTEND SERVICE: React Vite UI (Same pattern as Track 2)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: taskflow_mysql_frontend
    restart: unless-stopped
    ports:
      # Port 3001 to avoid colliding with Track 2 (Port 3000)
      - "3001:3000"

    volumes:
      # Live code hot-reloading with HMR (same as Track 2)
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend
