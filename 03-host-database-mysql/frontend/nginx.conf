# Nginx SPA & API Reverse Proxy configuration for Track 3
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Reverse proxy /api requests to Express backend container
    location /api/ {
        proxy_pass http://backend:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Client-side SPA routing: fall back to index.html on page refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
