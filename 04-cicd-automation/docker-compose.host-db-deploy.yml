# ==============================================================================
# 🐬 TRACK 4: OPTION C — HYBRID HOST DATABASE CONTINUOUS DEPLOYMENT
# ==============================================================================
# Pulls the containerized application image from GHCR, connects to host-native MySQL
# via host.docker.internal, and automatically updates via Watchtower on Git push!
#
# 🔒 SECRETS HYGIENE:
# Passwords and credentials are NEVER hardcoded in this file.
# Create a local, git-ignored .env file in this directory:
#   MYSQL_HOST=host.docker.internal
#   MYSQL_PORT=3306
#   MYSQL_USER=root
#   MYSQL_PASSWORD=your_local_password
#   MYSQL_DATABASE=simple_app
# ==============================================================================

services:
  app:
    image: ghcr.io/adarshgandla/docker-e2e-single:latest
    container_name: taskflow_prod_host_db
    restart: unless-stopped
    ports:
      - "4001:4001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DB_TYPE=mysql
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-simple_app}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: taskflow_watchtower_host_db
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
