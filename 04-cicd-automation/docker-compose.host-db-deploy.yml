# ==============================================================================
# 🐬 TRACK 4: OPTION C — HYBRID HOST DATABASE CONTINUOUS DEPLOYMENT
# ==============================================================================
# Pulls the containerized application image from GHCR, connects to host-native MySQL
# via host.docker.internal, and automatically updates via Watchtower on Git push!
#
# 🔒 SECRETS HYGIENE:
# Passwords and credentials are NEVER hardcoded in this file.
# Create a local, git-ignored .env file in this directory:
#   MYSQL_HOST=host.docker.internal
#   MYSQL_PORT=3306
#   MYSQL_USER=root
#   MYSQL_PASSWORD=your_local_password
#   MYSQL_DATABASE=simple_app
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Express API Backend (Bridging to Host MySQL)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../03-host-database-mysql/backend
      target: production
    image: ghcr.io/adarshgandla/docker-e2e-mysql-backend:latest
    container_name: taskflow_prod_host_backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - MYSQL_URL=${MYSQL_URL:-}
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-simple_app}
      - MYSQL_SSL=${MYSQL_SSL:-false}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ----------------------------------------------------------------------------
  # 2. React Vite Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../03-host-database-mysql/frontend
      target: production
    image: ghcr.io/adarshgandla/docker-e2e-mysql-frontend:latest
    container_name: taskflow_prod_host_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # 3. Watchtower Daemon (Auto-Deployment Agent)
  # ----------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: taskflow_watchtower_host_db
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

